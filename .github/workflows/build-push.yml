name: Slurm Matrix Build and Push

on:
  push:
    branches:
      - "main"
      - "dev"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Navigate to Build Directory
        run: cd schedmd/slurm/ubuntu-24.04

      - name: Build and Push Images
        uses: docker/compose-action@v2
        with:
          compose-file: schedmd/slurm/ubuntu-24.04/compose.yaml
          action: push
          build: true
          platforms: ${{ matrix.platform }}

