name: CI/CD Workflow

on:
  push:
    branches:
      - "main"
      - "dev"
      - "release-*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: [master, '24.05']
        flavor: [rockylinux-9, ubuntu-24.04]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin

      - name: Build Docker Image
        run: |
          export BAKE_TARGET="$(printf "%s_%s" "$(echo "$VERSION" | sed 's/[[:punct:]]//g')" "$(echo "$FLAVOR" | sed 's/[[:punct:]]//g')")"
          echo "BAKE_TARGET=$BAKE_TARGET"
          cd ./schedmd/slurm/
          docker buildx bake --print $BAKE_TARGET
          docker buildx bake --progress=plain $BAKE_TARGET
        env:
          VERSION: ${{ matrix.version }}
          FLAVOR: ${{ matrix.flavor }}

  push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: [master, '24.05']
        flavor: [rockylinux-9, ubuntu-24.04]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin

      - name: Push Docker Image
        run: |
          export BAKE_TARGET="$(printf "%s_%s" "$(echo "$VERSION" | sed 's/[[:punct:]]//g')" "$(echo "$FLAVOR" | sed 's/[[:punct:]]//g')")"
          echo "BAKE_TARGET=$BAKE_TARGET"
          cd ./schedmd/slurm/
          docker buildx bake --print $BAKE_TARGET
          docker buildx bake --progress=plain --push $BAKE_TARGET
        env:
          VERSION: ${{ matrix.version }}
          FLAVOR: ${{ matrix.flavor }}

  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: ['24.05']
        flavor: [rockylinux-9, ubuntu-24.04]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Login Info
        run: |
          if [ -z "$GHCR_TOKEN" ] || [ -z "$GHCR_USER" ]; then
            echo "Runner lacks login info. Either environment variables are not defined, or runner is on an unprotected branch/tag.";
            exit 1;
          fi
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USER: ${{ secrets.GHCR_USER }}

      - name: Log in to GitHub Container Registry
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USER: ${{ secrets.GHCR_USER }}

      - name: Build and Push Release Images
        run: |
          apk update && apk upgrade
          apk add --no-cache bash jq
          for daemon in slurmctld slurmd slurmdbd slurmrestd sackd ; do
            ./scripts/build.sh --registry=ghcr.io/${{ secrets.GHCR_USER }} --new-registry=ghcr.io/${{ secrets.GHCR_USER }} --target=$daemon --slurm-version=$VERSION --pull --no-build --push ./schedmd/slurm/$FLAVOR ;
          done
        env:
          VERSION: ${{ matrix.version }}
          FLAVOR: ${{ matrix.flavor }}

