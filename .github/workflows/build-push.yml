name: Slurm Matrix Build and Push

on:
  push:
    branches:
      - "main"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Images
        uses: docker/bake-action@v6
        with:
          source: "{{defaultContext}}:schedmd/slurm/ubuntu-24.04"
          push: true
          set: |
            database.tags=ghcr.io/${{ github.repository_owner }}/mariadb:latest
            accounting.tags=ghcr.io/${{ github.repository_owner }}/slurmdbd:latest
            control-plane.tags=ghcr.io/${{ github.repository_owner }}/slurmctld:latest
            compute.tags=ghcr.io/${{ github.repository_owner }}/slurmd:latest
            restapi.tags=ghcr.io/${{ github.repository_owner }}/slurmrestd:latest
            authcred.tags=ghcr.io/${{ github.repository_owner }}/sackd:latest

